services:
  - type: web
    name: ai-portrait-telegram-bot
    env: python
    region: frankfurt  # Или oregon, singapore - выберите ближайший
    plan: free
    branch: main  # Или ваша основная ветка
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false  # Нужно будет добавить вручную в Render Dashboard
      - key: GOOGLE_API_KEY
        sync: false  # Нужно будет добавить вручную в Render Dashboard
      - key: GOOGLE_VISION_MODEL
        value: gemini-1.5-flash
      - key: GOOGLE_IMAGE_MODEL
        value: imagen-3.0-generate-001
      - key: PYTHON_VERSION
        value: 3.11.0
