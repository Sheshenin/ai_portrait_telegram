<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание вебинаров</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .current-time {
            font-size: 1.3em;
            margin-top: 10px;
            opacity: 0.95;
        }

        .webinar-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.5s ease;
            margin-bottom: 30px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .webinar-status {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .status-live {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .webinar-title {
            font-size: 2em;
            color: #2c3e50;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .webinar-description {
            font-size: 1.1em;
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .webinar-time {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .time-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #f8f9fa;
            border-radius: 10px;
            font-weight: 500;
        }

        .time-icon {
            font-size: 1.3em;
        }

        .join-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 18px 45px;
            border-radius: 30px;
            font-size: 1.2em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .join-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .no-webinar {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .no-webinar-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .no-webinar h2 {
            color: #2c3e50;
            font-size: 1.8em;
            margin-bottom: 15px;
        }

        .no-webinar p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .next-webinar {
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            text-align: left;
        }

        .next-webinar h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .next-webinar-item {
            color: #333;
            margin-bottom: 8px;
            font-size: 1em;
        }

        .schedule-toggle {
            text-align: center;
            margin-top: 20px;
        }

        .toggle-button {
            background: white;
            color: #667eea;
            border: 2px solid white;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-button:hover {
            background: transparent;
            color: white;
        }

        .full-schedule {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .full-schedule.visible {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .full-schedule h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .schedule-item {
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .schedule-item.active {
            background: #d4edda;
            border-left-color: #28a745;
        }

        .schedule-item.past {
            opacity: 0.5;
        }

        .schedule-date {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .schedule-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 3px;
        }

        .time-remaining {
            display: inline-block;
            background: linear-gradient(135deg, #ffa751 0%, #ffe259 100%);
            color: #333;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 15px;
            font-size: 1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Расписание вебинаров</h1>
            <div class="current-time" id="currentTime">--:--:--</div>
        </div>

        <div id="webinarContainer"></div>

        <div class="schedule-toggle">
            <button class="toggle-button" onclick="toggleSchedule()">
                <span id="toggleText">📋 Показать полное расписание</span>
            </button>
        </div>

        <div class="full-schedule" id="fullSchedule">
            <h2>Полное расписание вебинаров</h2>
            <div id="scheduleList"></div>
        </div>
    </div>

    <script>
        // Расписание вебинаров (12 вебинаров по 75 минут каждый)
        const webinars = [
            {
                date: '2026-01-27', // ГГГГ-ММ-ДД
                time: '10:00',      // ЧЧ:ММ
                title: 'Введение в искусственный интеллект',
                description: 'Познакомьтесь с основами ИИ, машинного обучения и нейронных сетей. Узнайте, как ИИ меняет современный мир и какие возможности он открывает для бизнеса и личного развития.',
                url: 'https://example.com/webinar1'
            },
            {
                date: '2026-01-28',
                time: '14:00',
                title: 'Python для анализа данных',
                description: 'Изучите мощные библиотеки Python: Pandas, NumPy и Matplotlib. Научитесь обрабатывать, анализировать и визуализировать данные для принятия обоснованных решений.',
                url: 'https://example.com/webinar2'
            },
            {
                date: '2026-01-29',
                time: '11:00',
                title: 'Веб-разработка с React',
                description: 'Создавайте современные интерактивные веб-приложения с использованием React. Узнайте о компонентах, хуках, состоянии и лучших практиках разработки.',
                url: 'https://example.com/webinar3'
            },
            {
                date: '2026-01-30',
                time: '16:00',
                title: 'Основы кибербезопасности',
                description: 'Защитите свои данные и системы от киберугроз. Изучите основные принципы безопасности, методы защиты и инструменты для обеспечения информационной безопасности.',
                url: 'https://example.com/webinar4'
            },
            {
                date: '2026-02-03',
                time: '10:00',
                title: 'DevOps и CI/CD практики',
                description: 'Автоматизируйте процессы разработки и развертывания. Познакомьтесь с Docker, Kubernetes, Jenkins и другими инструментами современного DevOps.',
                url: 'https://example.com/webinar5'
            },
            {
                date: '2026-02-04',
                time: '13:00',
                title: 'Блокчейн и криптовалюты',
                description: 'Разберитесь в технологии блокчейн, смарт-контрактах и децентрализованных приложениях. Узнайте о перспективах и применении криптовалют.',
                url: 'https://example.com/webinar6'
            },
            {
                date: '2026-02-05',
                time: '15:00',
                title: 'Облачные вычисления: AWS и Azure',
                description: 'Освойте облачные платформы AWS и Microsoft Azure. Научитесь разворачивать, масштабировать и управлять приложениями в облаке.',
                url: 'https://example.com/webinar7'
            },
            {
                date: '2026-02-06',
                time: '11:30',
                title: 'Мобильная разработка с Flutter',
                description: 'Создавайте кроссплатформенные мобильные приложения с Flutter. Один код для iOS и Android - экономьте время и ресурсы.',
                url: 'https://example.com/webinar8'
            },
            {
                date: '2026-02-10',
                time: '14:30',
                title: 'Архитектура микросервисов',
                description: 'Проектируйте масштабируемые и гибкие приложения на основе микросервисной архитектуры. Изучите паттерны, best practices и антипаттерны.',
                url: 'https://example.com/webinar9'
            },
            {
                date: '2026-02-11',
                time: '10:30',
                title: 'Тестирование ПО: от теории к практике',
                description: 'Обеспечьте качество своего кода с помощью эффективного тестирования. Юнит-тесты, интеграционные тесты, TDD и автоматизация тестирования.',
                url: 'https://example.com/webinar10'
            },
            {
                date: '2026-02-12',
                time: '16:30',
                title: 'GraphQL: современный подход к API',
                description: 'Замените REST на GraphQL для более эффективной работы с данными. Узнайте о преимуществах, инструментах и лучших практиках использования GraphQL.',
                url: 'https://example.com/webinar11'
            },
            {
                date: '2026-02-13',
                time: '12:00',
                title: 'Карьера в IT: советы и стратегии',
                description: 'Постройте успешную карьеру в сфере информационных технологий. Резюме, собеседования, развитие навыков и построение профессиональной сети.',
                url: 'https://example.com/webinar12'
            }
        ];

        const WEBINAR_DURATION = 75; // минуты

        // Преобразование даты и времени вебинара в объект Date
        function parseWebinarDateTime(webinar) {
            const [year, month, day] = webinar.date.split('-').map(Number);
            const [hours, minutes] = webinar.time.split(':').map(Number);
            return new Date(year, month - 1, day, hours, minutes);
        }

        // Проверка, активен ли вебинар сейчас
        function isWebinarActive(webinar, now) {
            const startTime = parseWebinarDateTime(webinar);
            const endTime = new Date(startTime.getTime() + WEBINAR_DURATION * 60000);
            return now >= startTime && now < endTime;
        }

        // Форматирование даты
        function formatDate(date) {
            const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
                          'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
            const day = date.getDate();
            const month = months[date.getMonth()];
            return `${day} ${month}`;
        }

        // Вычисление оставшегося времени
        function getTimeRemaining(startTime, now) {
            const diff = startTime - now;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (days > 0) return `через ${days} дн.`;
            if (hours > 0) return `через ${hours} ч.`;
            if (minutes > 0) return `через ${minutes} мин.`;
            return 'скоро начнется';
        }

        // Вычисление времени до окончания вебинара
        function getTimeUntilEnd(endTime, now) {
            const diff = endTime - now;
            const minutes = Math.ceil(diff / 60000);
            if (minutes > 60) {
                const hours = Math.floor(minutes / 60);
                const mins = minutes % 60;
                return `Осталось: ${hours} ч. ${mins} мин.`;
            }
            return `Осталось: ${minutes} мин.`;
        }

        // Обновление текущего времени
        function updateCurrentTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            document.getElementById('currentTime').textContent =
                now.toLocaleDateString('ru-RU', options);
        }

        // Отображение активного вебинара
        function displayActiveWebinar(webinar, now) {
            const startTime = parseWebinarDateTime(webinar);
            const endTime = new Date(startTime.getTime() + WEBINAR_DURATION * 60000);
            const timeLeft = getTimeUntilEnd(endTime, now);

            return `
                <div class="webinar-card">
                    <div class="webinar-status status-live">🔴 ПРЯМОЙ ЭФИР</div>
                    <h2 class="webinar-title">${webinar.title}</h2>
                    <p class="webinar-description">${webinar.description}</p>
                    <div class="webinar-time">
                        <div class="time-info">
                            <span class="time-icon">📅</span>
                            <span>${formatDate(startTime)}</span>
                        </div>
                        <div class="time-info">
                            <span class="time-icon">🕐</span>
                            <span>${webinar.time} - ${endTime.getHours()}:${String(endTime.getMinutes()).padStart(2, '0')}</span>
                        </div>
                        <div class="time-info">
                            <span class="time-icon">⏱️</span>
                            <span>75 минут</span>
                        </div>
                    </div>
                    <div class="time-remaining">${timeLeft}</div>
                    <div style="margin-top: 25px;">
                        <a href="${webinar.url}" target="_blank" class="join-button">
                            🚀 Присоединиться к вебинару
                        </a>
                    </div>
                </div>
            `;
        }

        // Отображение сообщения об отсутствии активных вебинаров
        function displayNoWebinar(nextWebinar, now) {
            let content = `
                <div class="no-webinar">
                    <div class="no-webinar-icon">📚</div>
                    <h2>Сейчас нет активных вебинаров</h2>
                    <p>Вебинары доступны только во время их проведения</p>
            `;

            if (nextWebinar) {
                const startTime = parseWebinarDateTime(nextWebinar);
                const timeRemaining = getTimeRemaining(startTime, now);

                content += `
                    <div class="next-webinar">
                        <h3>🔔 Следующий вебинар:</h3>
                        <div class="next-webinar-item"><strong>Тема:</strong> ${nextWebinar.title}</div>
                        <div class="next-webinar-item"><strong>Дата:</strong> ${formatDate(startTime)}</div>
                        <div class="next-webinar-item"><strong>Время:</strong> ${nextWebinar.time}</div>
                        <div class="next-webinar-item"><strong>Начало:</strong> ${timeRemaining}</div>
                    </div>
                `;
            } else {
                content += `<p style="margin-top: 20px; color: #999;">Все вебинары завершены</p>`;
            }

            content += `</div>`;
            return content;
        }

        // Основная функция обновления
        function updateDisplay() {
            const now = new Date();
            const container = document.getElementById('webinarContainer');

            // Находим активный вебинар
            const activeWebinar = webinars.find(w => isWebinarActive(w, now));

            if (activeWebinar) {
                container.innerHTML = displayActiveWebinar(activeWebinar, now);
            } else {
                // Находим следующий вебинар
                const futureWebinars = webinars.filter(w => {
                    const startTime = parseWebinarDateTime(w);
                    return startTime > now;
                });

                futureWebinars.sort((a, b) => {
                    return parseWebinarDateTime(a) - parseWebinarDateTime(b);
                });

                const nextWebinar = futureWebinars[0] || null;
                container.innerHTML = displayNoWebinar(nextWebinar, now);
            }

            updateScheduleList(now);
        }

        // Обновление списка расписания
        function updateScheduleList(now) {
            const scheduleList = document.getElementById('scheduleList');

            let html = '';
            webinars.forEach(webinar => {
                const startTime = parseWebinarDateTime(webinar);
                const endTime = new Date(startTime.getTime() + WEBINAR_DURATION * 60000);
                const isActive = isWebinarActive(webinar, now);
                const isPast = endTime < now;

                let className = 'schedule-item';
                if (isActive) className += ' active';
                else if (isPast) className += ' past';

                html += `
                    <div class="${className}">
                        <div class="schedule-date">
                            ${formatDate(startTime)} в ${webinar.time}
                            ${isActive ? ' - 🔴 СЕЙЧАС' : isPast ? ' - ✓ Завершён' : ''}
                        </div>
                        <div class="schedule-title">${webinar.title}</div>
                    </div>
                `;
            });

            scheduleList.innerHTML = html;
        }

        // Переключение видимости расписания
        function toggleSchedule() {
            const schedule = document.getElementById('fullSchedule');
            const toggleText = document.getElementById('toggleText');

            if (schedule.classList.contains('visible')) {
                schedule.classList.remove('visible');
                toggleText.textContent = '📋 Показать полное расписание';
            } else {
                schedule.classList.add('visible');
                toggleText.textContent = '✕ Скрыть расписание';
            }
        }

        // Инициализация
        function init() {
            updateCurrentTime();
            updateDisplay();

            setInterval(updateCurrentTime, 1000);
            setInterval(updateDisplay, 10000); // Обновляем каждые 10 секунд
        }

        window.onload = init;
    </script>
</body>
</html>
